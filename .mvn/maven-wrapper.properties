# Este arquivo é o que faz "./mvnw" (Maven Wrapper) baixar e usar
# SEMPRE esta versão exata do Maven, em qualquer máquina — a sua, a de
# outro estagiário, ou o runner do GitHub Actions. Sem isso, cada
# ambiente usa "o Maven que calhou de estar instalado", o que é mais
# uma fonte de "funciona aqui, não funciona lá" para eliminar.
#
# Gerado originalmente com: mvn wrapper:wrapper -Dmaven=3.9.9
# (os scripts mvnw / mvnw.cmd também fazem parte do wrapper e são
# gerados pelo mesmo comando — omitidos aqui por serem boilerplate
# padrão do Maven, não código específico deste projeto)
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
