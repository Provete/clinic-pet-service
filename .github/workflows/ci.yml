name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run All Tests (Unit and Integration)
        # The 'verify' goal triggers both Surefire (unit tests) and Failsafe (integration tests).
        # The ubuntu-latest runner already has Docker running, so Testcontainers will work automatically.
        run: mvn clean verify